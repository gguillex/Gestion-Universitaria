name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    name: Compilar y ejecutar las pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Las pruebas no necesitan base de datos: los DAO y las peticiones se simulan con Mockito.
      - name: mvn verify
        run: ./mvnw -B verify
